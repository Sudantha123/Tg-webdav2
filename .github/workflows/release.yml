name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Go mod tidy
        run: go mod tidy

      - name: Test
        run: go test ./... -count=1

      - name: Resolve version
        id: ver
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o "dist/tgwebdav-${1}-${3}" .
            echo "built dist/tgwebdav-${1}-${3}"
          }
          build linux amd64 amd64
          build linux arm64 arm64
          build windows amd64 amd64.exe
          build darwin arm64 arm64
          cd dist
          sha256sum * > checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgwebdav-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: TgWebDAV ${{ steps.ver.outputs.version }}
          files: |
            dist/tgwebdav-*
            dist/checksums.txt
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
